<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OliWeight">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>OliWeight</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2723; --ink2:#55605a; --muted:#8a938e; --line:#e4e1d8;
  --accent:#2f6f5e; --accent-soft:#e3efe9; --target:#9aa39e;
  --ok:#2e7d4f; --ok-bg:#e2f2e8; --part:#a86b00; --part-bg:#fbf0d9; --rep:#3d5f9e; --rep-bg:#e4ebf7; --skip:#b23a3a; --skip-bg:#f8e3e3;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141816; --card:#1d2320; --ink:#eef1ef; --ink2:#b9c2bd; --muted:#87918c; --line:#2d3531;
    --accent:#6cc0a5; --accent-soft:#1f3a31; --target:#6e7873;
    --ok:#7fd3a0; --ok-bg:#1d3527; --part:#f0bd5c; --part-bg:#3a2e14; --rep:#9bb7ec; --rep-bg:#1f2b44; --skip:#f09a9a; --skip-bg:#3e2020; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;color:var(--accent);letter-spacing:.2px}
header small{color:var(--muted)}
main{padding:12px 14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--ink2)}
.sub{color:var(--ink2);font-size:14px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.datebar .d{font-weight:600;text-align:center}
.meal .code{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:6px}
.meal .slot{font-size:13px;color:var(--muted)}
.meal .name{font-weight:600;margin:2px 0}
.meal .det{font-size:14px;color:var(--ink2);margin:0 0 10px}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.status button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px;padding:4px}
.status button.on[data-s=ok]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.status button.on[data-s=partiel]{background:var(--part-bg);border-color:var(--part);color:var(--part);font-weight:700}
.status button.on[data-s=remplace]{background:var(--rep-bg);border-color:var(--rep);color:var(--rep);font-weight:700}
.status button.on[data-s=saute]{background:var(--skip-bg);border-color:var(--skip);color:var(--skip);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:8px 12px;font-size:13px;min-height:36px}
.chips button.on{background:var(--part-bg);border-color:var(--part);color:var(--part);font-weight:600}
input[type=text],input[type=number],input[type=time],input[type=date],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.counter{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.counter:first-of-type{border-top:0}
.counter .lab{font-size:15px}
.counter .lab small{display:block;color:var(--muted);font-size:12px}
.counter .ctl{display:flex;align-items:center;gap:8px}
.counter .ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px}
.counter .ctl .v{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.counter .ctl input{width:96px;text-align:center}
.scale{display:flex;gap:6px}
.scale button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;width:100%;margin-top:8px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{width:auto;min-height:38px;padding:6px 12px;font-size:14px;margin:0}
.banner{background:var(--part-bg);color:var(--part);border:1px solid var(--part);border-radius:var(--r);padding:12px;margin-bottom:12px;font-size:14px}
.alert{background:var(--skip-bg);color:var(--skip);border:1px solid var(--skip);border-radius:10px;padding:10px;margin:6px 0;font-size:14px}
.good{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:10px;margin:6px 0;font-size:14px}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:8px 0 10px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent);font-weight:700}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:4px 0 8px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:4px}
.legend i.tg{border-top:2px dashed var(--target)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:90%}
.edit{display:none;margin-top:8px}
.edit.open{display:block}
.daymenu{border-top:1px solid var(--line);padding:10px 0}
.daymenu:first-of-type{border-top:0}
.daymenu .dn{font-weight:700;margin-bottom:4px}
.mrow{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.mrow .slot{width:76px;flex:none;font-size:12px;color:var(--muted);padding-top:2px}
.mrow button.link{background:none;border:0;color:var(--ink);font:inherit;text-align:left;padding:0;font-size:14px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<header>
  <h1>OliWeight</h1>
  <small id="hdrinfo"></small>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Aujourd'hui</button>
  <button data-v="menus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Menus</button>
  <button data-v="weigh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9a4 4 0 016 0l-3 3"/></svg>Pesée</button>
  <button data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18l5-6 4 3 7-9"/></svg>Progrès</button>
  <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Réglages</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="sr">

<script>
"use strict";
/* ---------- Données par défaut : Menus semaine 1 ---------- */
const DEFAULT_MEALS = {
  "P1":{name:"Salade + sardines",details:"Laitue, chou rouge, tomate, concombre, carotte, oignon + 1 boîte de sardines égouttées + 1 œuf + 1 tranche de pain complet. Vinaigrette : 1 c. à soupe d'huile + vinaigre."},
  "P2":{name:"Salade + œufs, avocat, fromage",details:"Salade de base + 2 œufs + ¼ d'avocat + 30 g de fromage + 1 tranche de pain complet. Dimanche : pommes de terre au four au lieu du pain."},
  "P3":{name:"Yaourt grec, fruit, œuf",details:"¾ de tasse de yaourt grec nature + 1 fruit + 1 œuf + 1 tranche de pain complet."},
  "C1":{name:"Fruit entier",details:"1 fruit entier (pas de jus)."},
  "C2":{name:"Whey + fruit",details:"1 dose de whey dans de l'eau ou du lait 1 % + 1 fruit."},
  "D1":{name:"Poulet grillé, gombo sauté",details:"Poulet grillé (paume) + gombo sauté + 2 petites pommes de terre bouillies."},
  "D2":{name:"Haricots aux légumes",details:"Haricots aux légumes + salade de crudités. Les haricots comptent comme féculent."},
  "D3":{name:"Bol méditerranéen",details:"Poulet + ½ tasse de pois chiches + crudités + 1 c. à soupe d'huile d'olive."},
  "D4":{name:"Maquereau ou sardines grillés",details:"Poisson grillé + épinards sautés + 1 taro."},
  "D5":{name:"Sauté asiatique poulet-légumes",details:"Poulet et légumes sautés + ¾ de tasse de spaghetti ou de nouilles."},
  "D6":{name:"Curry de lentilles",details:"Curry de lentilles aux légumes + ½ tasse de riz."},
  "D7":{name:"Okok allégé au bœuf maigre",details:"Okok (moitié moins d'huile et d'arachide) + ½ bâton de manioc."},
  "S-A":{name:"Poisson braisé sauce tomate + plantain",details:"Tilapia ou maquereau, sauce tomate-oignons-poivrons-épinards, 1 c. à soupe d'huile par personne + ½ plantain bouilli."},
  "S-B":{name:"Poulet aux légumes + riz",details:"Poulet sans peau, beaucoup de légumes, 1 c. à soupe d'huile par personne + ¾ de tasse de riz cuit."},
  "S-C":{name:"Sauce gombo au bœuf maigre + couscous de maïs",details:"Gombo et épinards, 1 c. à soupe d'huile de palme par personne, bœuf maigre + crevettes séchées + 1 petite boule de couscous."},
  "S-D":{name:"Poisson grillé, épinards, taro",details:"Grillade rapide du dimanche : poisson grillé + épinards sautés + 1 taro."}
};
// jour ISO : 1 = lundi … 7 = dimanche → codes [P, C1, D, C2, S]
const DEFAULT_PLAN = {
  1:["P1","C1","D1","C2","S-A"], 2:["P2","C1","D2","C2","S-A"], 3:["P3","C1","D3","C2","S-B"],
  4:["P1","C1","D4","C2","S-B"], 5:["P2","C1","D5","C2","S-C"], 6:["P3","C1","D6","C2","S-C"],
  7:["P2","C1","D7","C2","S-D"]
};
const SLOTS = [["P","Petit-déjeuner · 9 h"],["C1","Collation · 11 h"],["D","Dîner · 13 h"],["C2","Collation · 15 h 30"],["S","Souper · 17 h"]];
const STATUS = [["ok","✅ Respecté"],["partiel","🟡 Partiel"],["remplace","🔄 Remplacé"],["saute","❌ Sauté"]];
const STATUS_LABEL = {ok:"Respecté",partiel:"Partiel",remplace:"Remplacé",saute:"Sauté"};
const REASONS = ["Portion plus grosse","Plus d'huile","Plus de sucre","Ingrédient remplacé","Pas eu le temps"];
const DAYS = ["","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

/* ---------- Stockage ---------- */
const KEY = "oliweight.v1";
function defaults(){
  return {
    version:1,
    settings:{startWeight:116,startDate:"2026-11-09",rate:0.5,waterGoal:10,stepsGoal:5000,weighDay:1,reminder:"20:00",menuLabel:"Menus semaine 1"},
    meals:JSON.parse(JSON.stringify(DEFAULT_MEALS)),
    plan:JSON.parse(JSON.stringify(DEFAULT_PLAN)),
    logs:{}, weights:[]
  };
}
let S;
let memoryOnly = false;
function load(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : defaults(); }
  catch(e){ S = defaults(); memoryOnly = true; }
  normalize();
}
function normalize(){
  const d = defaults();
  S.settings = Object.assign(d.settings, S.settings||{});
  S.meals = S.meals||d.meals; S.plan = S.plan||d.plan; S.logs = S.logs||{}; S.weights = S.weights||[];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); memoryOnly=false; }
  catch(e){ memoryOnly = true; }
}

/* ---------- Utilitaires ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return iso(d); }
function isoDow(s){ const g=parseD(s).getDay(); return g===0?7:g; }
function fmtDate(s,opt){ return parseD(s).toLocaleDateString("fr-CA",opt||{weekday:"long",day:"numeric",month:"long"}); }
function today(){ return iso(new Date()); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",2600); }
function log(date){ if(!S.logs[date]) S.logs[date]={meals:{},water:0,steps:"",feedsDay:0,feedsNight:0,sleep:"",energy:0,hunger:0,note:""}; return S.logs[date]; }
function num(v){ const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; }
function round1(n){ return Math.round(n*10)/10; }

/* ---------- Navigation ---------- */
let view = "today", curDate = today();
function go(v){ view=v; document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); render(); window.scrollTo(0,0); }
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) go(b.dataset.v); });

function render(){
  $("#hdrinfo").textContent = S.settings.menuLabel || "";
  const app = $("#app");
  if(view==="today") app.innerHTML = viewToday();
  if(view==="menus") app.innerHTML = viewMenus();
  if(view==="weigh") app.innerHTML = viewWeigh();
  if(view==="progress") { app.innerHTML = viewProgress(); bindChart(); }
  if(view==="settings") app.innerHTML = viewSettings();
}

/* ---------- Aujourd'hui ---------- */
function dayComplete(date){
  const L=S.logs[date]; if(!L) return false;
  return SLOTS.every(([k])=>L.meals[k] && L.meals[k].status);
}
function viewToday(){
  const L = log(curDate), dow = isoDow(curDate), codes = S.plan[dow]||[];
  let h = "";
  const now = new Date(), [rh,rm] = (S.settings.reminder||"20:00").split(":").map(Number);
  if(curDate===today() && (now.getHours()*60+now.getMinutes()) >= rh*60+rm && !dayComplete(curDate))
    h += `<div class="banner">⏰ C'est l'heure du suivi : il reste des repas à noter aujourd'hui.</div>`;
  if(memoryOnly) h += `<div class="banner">Ce navigateur ne garde pas les données. Installe l'app depuis son lien pour les conserver.</div>`;
  h += `<div class="datebar"><button data-act="prev" aria-label="Jour précédent">‹</button>
        <div class="d">${esc(fmtDate(curDate))}${curDate===today()?'<div class="muted">aujourd\'hui</div>':''}</div>
        <button data-act="next" aria-label="Jour suivant" ${curDate>=today()?"disabled style='opacity:.3'":""}>›</button></div>`;
  SLOTS.forEach(([k,label],i)=>{
    const code = codes[i], m = S.meals[code]||{name:"(repas non défini)",details:""}, st = L.meals[k]||{};
    h += `<div class="card meal" data-slot="${k}">
      <div class="slot">${esc(label)}</div>
      <div class="name"><span class="code">${esc(code||"–")}</span>${esc(m.name)}</div>
      <p class="det">${esc(m.details)}</p>
      <div class="status">${STATUS.map(([s,l])=>`<button data-act="status" data-s="${s}" class="${st.status===s?"on":""}">${l}</button>`).join("")}</div>
      ${st.status==="partiel"?`<div class="chips">${REASONS.map(r=>`<button data-act="reason" data-r="${esc(r)}" class="${(st.reasons||[]).includes(r)?"on":""}">${esc(r)}</button>`).join("")}</div>`:""}
      ${st.status==="remplace"?`<label class="f">Qu'as-tu mangé à la place ?</label><input type="text" data-act="repl" value="${esc(st.replaced||"")}" placeholder="ex. riz sauté + poulet frit">`:""}
    </div>`;
  });
  const sc = (key,val)=>`<div class="scale">${[1,2,3,4,5].map(n=>`<button data-act="scale" data-k="${key}" data-n="${n}" class="${val===n?"on":""}">${n}</button>`).join("")}</div>`;
  h += `<div class="card"><h2>Ma journée</h2>
    <div class="counter"><div class="lab">Eau<small>verres · objectif ${S.settings.waterGoal}</small></div><div class="ctl"><button data-act="dec" data-k="water">−</button><span class="v">${L.water}</span><button data-act="inc" data-k="water">+</button></div></div>
    <div class="counter"><div class="lab">Tétées le jour</div><div class="ctl"><button data-act="dec" data-k="feedsDay">−</button><span class="v">${L.feedsDay}</span><button data-act="inc" data-k="feedsDay">+</button></div></div>
    <div class="counter"><div class="lab">Tétées la nuit</div><div class="ctl"><button data-act="dec" data-k="feedsNight">−</button><span class="v">${L.feedsNight}</span><button data-act="inc" data-k="feedsNight">+</button></div></div>
    <div class="counter"><div class="lab">Pas<small>objectif ${S.settings.stepsGoal}</small></div><div class="ctl"><input type="number" inputmode="numeric" data-act="field" data-k="steps" value="${esc(L.steps)}" placeholder="0"></div></div>
    <div class="counter"><div class="lab">Sommeil<small>heures</small></div><div class="ctl"><input type="number" inputmode="decimal" step="0.5" data-act="field" data-k="sleep" value="${esc(L.sleep)}" placeholder="0"></div></div>
    <div class="counter"><div class="lab">Énergie<small>1 = épuisée · 5 = en forme</small></div></div>${sc("energy",L.energy)}
    <div class="counter"><div class="lab">Faim<small>1 = pas faim · 5 = très faim</small></div></div>${sc("hunger",L.hunger)}
    <label class="f">Note (fringale, fatigue, contexte)</label>
    <textarea data-act="field" data-k="note">${esc(L.note)}</textarea>
  </div>`;
  return h;
}
document.addEventListener("click",e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(view==="today"){
    const L = log(curDate);
    if(act==="prev"){ curDate=addDays(curDate,-1); render(); return; }
    if(act==="next"){ if(curDate<today()){ curDate=addDays(curDate,1); render(); } return; }
    const card = b.closest("[data-slot]");
    if(act==="status" && card){
      const k=card.dataset.slot, cur=L.meals[k]||{};
      L.meals[k] = cur.status===b.dataset.s ? {} : {status:b.dataset.s, reasons: b.dataset.s==="partiel"?(cur.reasons||[]):[], replaced: b.dataset.s==="remplace"?(cur.replaced||""):""};
      save(); render(); if(dayComplete(curDate)) toast("Journée complète, bravo !"); return;
    }
    if(act==="reason" && card){
      const k=card.dataset.slot, r=b.dataset.r, arr=L.meals[k].reasons=L.meals[k].reasons||[];
      const i=arr.indexOf(r); i>=0?arr.splice(i,1):arr.push(r); save(); render(); return;
    }
    if(act==="inc"||act==="dec"){ const k=b.dataset.k; L[k]=Math.max(0,(L[k]||0)+(act==="inc"?1:-1)); save(); render(); return; }
    if(act==="scale"){ const k=b.dataset.k,n=+b.dataset.n; L[k]=L[k]===n?0:n; save(); render(); return; }
  }

  }

      const f=id=>$("#"+id).value;

        rate:num(f("s-rate"))||0.5,waterGoal:parseInt(f("s-water"))||10,stepsGoal:parseInt(f("s-steps"))||5000,
        weighDay:parseInt(f("s-wd"))||1,reminder:f("s-rem")||"20:00"});

    }
    if(act==="csv") return downloadFile("oliweight-"+today()+".csv","text/csv;charset=utf-8","﻿"+buildCSV());
    if(act==="copy") return copyText(buildSummary());
    if(act==="backup") return downloadFile("oliweight-sauvegarde-"+today()+".json","application/json",JSON.stringify(S,null,1));
    if(act==="ics") return downloadFile("rappel-oliweight.ics","text/calendar;charset=utf-8",buildICS());
    if(act==="import"){ importMode=b.dataset.mode; $("#fileIn").click(); return; }
    if(act==="reset"){ const el=$("#resetbox"); el.classList.toggle("open"); return; }
    if(act==="resetyes"){ S=defaults(); save(); render(); toast("Données effacées"); return; }
  }
});

function lastNDates(n, end){ const out=[]; for(let i=n-1;i>=0;i--) out.push(addDays(end||today(),-i)); return out; }
function adherence(dates){
  let pts=0,n=0; const bySlot={}, reasons={}, counts={ok:0,partiel:0,remplace:0,saute:0};
  dates.forEach(d=>{ const L=S.logs[d]; if(!L) return; SLOTS.forEach(([k])=>{ const m=L.meals[k]; if(!m||!m.status) return;
    n++; counts[m.status]++; const p=m.status==="ok"?1:m.status==="partiel"?0.5:0; pts+=p;
    bySlot[k]=bySlot[k]||{p:0,n:0}; bySlot[k].p+=p; bySlot[k].n++;
    (m.reasons||[]).forEach(r=>reasons[r]=(reasons[r]||0)+1); if(m.status==="remplace") reasons["Repas remplacé"]=(reasons["Repas remplacé"]||0)+1; }); });
  return {pct:n?Math.round(pts/n*100):null,n,bySlot,reasons,counts};
}
function avg(dates,key){ const v=dates.map(d=>S.logs[d]&&num(S.logs[d][key])).filter(x=>x!==null&&x>0); return v.length?round1(v.reduce((a,b)=>a+b,0)/v.length):null; }
function avgFeeds(dates){ const v=dates.map(d=>S.logs[d]?(S.logs[d].feedsDay||0)+(S.logs[d].feedsNight||0):null).filter(x=>x); return v.length?round1(v.reduce((a,b)=>a+b,0)/v.length):null; }
function viewProgress(){

  let h = `<div class="card"><h2>Poids</h2>`;
  if(last){ const lost=round1(start-last.kg), weeks=Math.max(1,(parseD(last.date)-parseD(S.settings.startDate))/(7*864e5)), target=round1(start-S.settings.rate*weeks);

  else h += `<p class="sub">Départ : ${start} kg. La courbe apparaîtra après la première pesée.</p>`;
  h += `<div class="legend"><span><i></i>Poids mesuré</span><span><i class="tg"></i>Cible −${S.settings.rate} kg/sem.</span></div><div class="chart" id="chart">${chartSVG()}<div class="tip" id="tip"></div></div></div>`;
  // alertes
  const alerts=[];
  if(W.length>=2){ const a=W[W.length-2], b=W[W.length-1], wks=Math.max(1,(parseD(b.date)-parseD(a.date))/(7*864e5)); const r=(a.kg-b.kg)/wks;
    if(r>1) alerts.push(`Perte de ${round1(r)} kg/semaine : c'est trop rapide pour l'allaitement. Ajoute une collation et préviens Bertrand.`); }
  const f1=avgFeeds(wk), f0=avgFeeds(prevWk); if(f1!==null&&f0!==null&&f0-f1>=2) alerts.push(`Les tétées ont baissé (${f0} → ${f1} par jour). Si le lait semble diminuer, on remonte les apports.`);
  const en=avg(wk,"energy"); if(en!==null&&en<=2) alerts.push(`Énergie moyenne basse (${en}/5). Parles-en à ton médecin, surtout avec l'antécédent d'anémie.`);
  h += `<div class="card"><h2>Signaux</h2>${alerts.length?alerts.map(a=>`<div class="alert">⚠️ ${esc(a)}</div>`).join(""):`<div class="good">✓ Aucun signal d'alerte cette semaine.</div>`}</div>`;
  // adhérence
  h += `<div class="card"><h2>Respect des menus · 7 derniers jours</h2>`;
  if(A.pct===null) h += `<p class="muted">Rien de noté cette semaine.</p>`;
  else { h += `<div class="stats"><div class="stat"><b>${A.pct} %</b><span>respect global</span></div><div class="stat"><b>${A.counts.ok}/${A.n}</b><span>repas respectés</span></div></div>
    <h3>Par repas</h3>`;
    SLOTS.forEach(([k,label])=>{ const s=A.bySlot[k]; if(!s) return; const p=Math.round(s.p/s.n*100);
      h += `<div style="margin:8px 0"><div class="row between"><span style="font-size:14px">${esc(label.split(" ·")[0])}</span><span class="muted">${p} %</span></div><div class="progress"><i style="width:${p}%"></i></div></div>`; });

    if(rs.length){ h += `<h3>Ce qui coince</h3><table class="t">${rs.map(([r,n])=>`<tr><td>${esc(r)}</td><td class="n">${n} fois</td></tr>`).join("")}</table>`; } }
  h += `</div>`;
  const wa=avg(wk,"water"), st=avg(wk,"steps"), sl=avg(wk,"sleep");
  h += `<div class="card"><h2>Moyennes · 7 derniers jours</h2><div class="stats">
    <div class="stat"><b>${wa??"–"}</b><span>verres d'eau / jour</span></div>

    <div class="stat"><b>${sl??"–"}</b><span>heures de sommeil</span></div></div></div>`;
  return h;
}
let chartPts=[];
function chartSVG(){
  const W=S.weights, w=340, hgt=200, pl=36, pr=10, pt=12, pb=26;
  const start=S.settings.startWeight, sd=S.settings.startDate;
  const endD = W.length? (W[W.length-1].date>addDays(sd,56)?W[W.length-1].date:addDays(sd,56)) : addDays(sd,56);
  const ts=parseD(sd).getTime(), t0=Math.min(ts, W.length?parseD(W[0].date).getTime():ts), t1=parseD(endD).getTime();
  const tgtEnd=start-S.settings.rate*((t1-ts)/(7*864e5));
  const vals=[start,tgtEnd,...W.map(x=>x.kg)]; let lo=Math.floor(Math.min(...vals)-1), hi=Math.ceil(Math.max(...vals)+1);
  const X=t=>pl+(t-t0)/(t1-t0||1)*(w-pl-pr), Y=v=>pt+(hi-v)/(hi-lo||1)*(hgt-pt-pb);
  let g=""; const step=Math.max(1,Math.ceil((hi-lo)/4));
  for(let v=lo; v<=hi; v+=step){ g+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`; }
  for(let i=0;i<=4;i++){ const t=t0+(t1-t0)*i/4, d=iso(new Date(t)); g+=`<text x="${X(t)}" y="${hgt-8}" text-anchor="${i===0?"start":i===4?"end":"middle"}" font-size="10" fill="var(--muted)">${esc(fmtDate(d,{day:"numeric",month:"short"}))}</text>`; }
  g += `<line x1="${X(ts)}" y1="${Y(start)}" x2="${X(t1)}" y2="${Y(tgtEnd)}" stroke="var(--target)" stroke-width="2" stroke-dasharray="5 4"/>`;
  chartPts = W.map(x=>({x:X(parseD(x.date).getTime()),y:Y(x.kg),kg:x.kg,date:x.date}));
  const startFirst = !W.length || W[0].date > sd;
  const all = startFirst ? [{x:X(ts),y:Y(start)},...chartPts] : chartPts;
  if(chartPts.length) g += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${all.map(p=>p.x+","+p.y).join(" ")}"/>`;
  if(startFirst) g += `<circle cx="${X(ts)}" cy="${Y(start)}" r="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`;
  chartPts.forEach(p=>{ g+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`; });
  return `<svg viewBox="0 0 ${w} ${hgt}" role="img" aria-label="Courbe du poids comparée à la cible">${g}<rect x="${pl}" y="${pt}" width="${w-pl-pr}" height="${hgt-pt-pb}" fill="transparent" id="hit"/></svg>`;
}
function bindChart(){
  const hit=$("#hit"), tip=$("#tip"), box=$("#chart"); if(!hit||!chartPts.length) return;
  const show=e=>{ const svg=hit.ownerSVGElement, r=svg.getBoundingClientRect(), sx=(e.touches?e.touches[0].clientX:e.clientX)-r.left, vx=sx*340/r.width;
    let best=chartPts[0]; chartPts.forEach(p=>{ if(Math.abs(p.x-vx)<Math.abs(best.x-vx)) best=p; });
    tip.style.display="block"; tip.style.left=(best.x*r.width/340)+"px"; tip.style.top=(best.y*r.height/200)+"px";
    tip.textContent=fmtDate(best.date,{day:"numeric",month:"short"})+" · "+best.kg.toFixed(1)+" kg"; };
  hit.addEventListener("pointermove",show); hit.addEventListener("pointerdown",show); box.addEventListener("pointerleave",()=>tip.style.display="none");
}

function csvCell(v){ v=String(v==null?"":v); return /[";\n,]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function buildCSV(){
  const head=["date","jour"]; SLOTS.forEach(([k])=>head.push(k+"_code",k+"_statut",k+"_raisons",k+"_remplace"));
  head.push("eau_verres","pas","tetees_jour","tetees_nuit","sommeil_h","energie","faim","note","poids_kg","tour_taille_cm");
  const rows=[head.join(";")], wmap={}; S.weights.forEach(w=>wmap[w.date]=w);
  const dates=[...new Set([...Object.keys(S.logs),...Object.keys(wmap)])].sort();
  dates.forEach(d=>{ const L=S.logs[d]||{meals:{}}, codes=S.plan[isoDow(d)]||[], r=[d,DAYS[isoDow(d)]];
    SLOTS.forEach(([k],i)=>{ const m=L.meals[k]||{}; r.push(codes[i]||"",m.status?STATUS_LABEL[m.status]:"",(m.reasons||[]).join(" | "),m.replaced||""); });
    r.push(L.water??"",L.steps??"",L.feedsDay??"",L.feedsNight??"",L.sleep??"",L.energy||"",L.hunger||"",L.note||"",wmap[d]?wmap[d].kg:"",wmap[d]&&wmap[d].waist?wmap[d].waist:"");
    rows.push(r.map(csvCell).join(";")); });
  return rows.join("\r\n");
}
function buildSummary(){
  const wk=lastNDates(7), A=adherence(wk), W=S.weights;
  let t=`OliWeight · semaine du ${wk[0]} au ${wk[6]}\n`;
  t+=`Poids : ${W.length?W.map(w=>w.date+" "+w.kg+" kg"+(w.waist?" / "+w.waist+" cm":"")).slice(-4).join(", "):"aucune pesée"}\n`;
  t+=`Respect global : ${A.pct===null?"–":A.pct+" %"} (${A.counts.ok} respectés, ${A.counts.partiel} partiels, ${A.counts.remplace} remplacés, ${A.counts.saute} sautés)\n`;
  t+=`Moyennes : eau ${avg(wk,"water")??"–"} verres, pas ${avg(wk,"steps")??"–"}, tétées ${avgFeeds(wk)??"–"}, sommeil ${avg(wk,"sleep")??"–"} h, énergie ${avg(wk,"energy")??"–"}/5, faim ${avg(wk,"hunger")??"–"}/5\n\nDétail :\n`;
  wk.forEach(d=>{ const L=S.logs[d]; if(!L) return; const codes=S.plan[isoDow(d)]||[];
    const parts=SLOTS.map(([k],i)=>{ const m=L.meals[k]; if(!m||!m.status) return null;
      return codes[i]+" "+STATUS_LABEL[m.status]+((m.reasons||[]).length?" ("+m.reasons.join(", ")+")":"")+(m.replaced?" → "+m.replaced:""); }).filter(Boolean);
    t+=`- ${DAYS[isoDow(d)]} ${d} : ${parts.join(" ; ")||"repas non notés"}${L.note?" | note : "+L.note:""}\n`; });

function buildICS(){

let dlApi=null;
if(window.claude && typeof window.claude.use==="function"){ try{ window.claude.use("downloads").then(d=>{dlApi=d;}).catch(()=>{}); }catch(e){} }
async function downloadFile(name,type,content){
  if(dlApi){ try{ await dlApi.save({filename:name,data:content}); toast("Fichier prêt : "+name); }catch(e){ copyText(content); } return; }
  try{ const blob=new Blob([content],{type}), url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("Fichier prêt : "+name); }
  catch(e){ copyText(content); }
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast("Copié : colle-le dans le message à Bertrand"),()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Copié"); }catch(e){ toast("Copie impossible sur ce navigateur"); } ta.remove();
}
let importMode="menu";
$("#fileIn").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const data=JSON.parse(await f.text());
    if(importMode==="menu"){
      if(!data.meals||!data.plan) throw new Error("format");
      S.meals=data.meals; S.plan=data.plan; if(data.label) S.settings.menuLabel=data.label; toast("Nouveaux menus importés");
    } else {
      if(!data.settings||!data.logs) throw new Error("format");
      S=data; normalize(); toast("Sauvegarde restaurée");
    }
    save(); render();
  }catch(err){ toast("Fichier non reconnu"); }
});

/* ---------- Démarrage ---------- */
load(); render();
if("serviceWorker" in navigator && location.protocol==="https:"){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && view==="today"){ if(curDate>today()) curDate=today(); render(); } });
</script>
